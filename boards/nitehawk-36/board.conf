[board]
name = LDO Nitehawk-36 toolboard
klipper_flash = katapult
katapult_install = rp2-bootsel
boot_mode = Reboot the toolboard into system boot mode:
    1. Press and hold both the RESET and BOOT0 buttons.
    2. Release the RESET button.
    3. Release the BOOT0 button.
katapult_entry = Quickly double-click the RESET button; the ACT light should blink slowly.
